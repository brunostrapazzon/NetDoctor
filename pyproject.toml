[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "netdoctor"
version = "0.1.0"
description = "Diagnostica problemas de internet no Windows e explica a causa em português simples."
readme = "README.md"
requires-python = ">=3.11"
license = "PolyForm-Noncommercial-1.0.0"
authors = [{ name = "Bruno Strapazzon" }]
dependencies = [
    "dnspython>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
netdoctor = "netdoctor.cli:main"

[tool.setuptools.packages.find]
include = ["netdoctor*"]

[tool.setuptools.package-data]
netdoctor = ["core/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
